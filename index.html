<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tic-tac-toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="messegeContainer hide">
        <p id="messege">
            winner
        </p>
        <button id="newgame">New Game</button>
    </div>
    <main>
        <h1 id="title">Tic Tac Toe</h1>
        <div class="scoreboard">
            <span id="xScore">X : 0</span>
            <span id="drawScore">draws : 0</span>
            <span id="oScore">O : 0</span>
        </div>     
        <div class="container">
            <div class="game">
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            </div>
        </div>
        <button id="reset" class="action-button">Reset Game</button>
        <button id="resetScore" class="action-button">Reset Score</button>
    </main>
    
    <script src="script.js"></script>
</body>
</html>
